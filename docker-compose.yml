services:
  mysql:
    image: mysql:8.0
    container_name: repair-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [backend]
    # 3306 不映射到宿主机，仅内网可达

  redis:
    image: redis:7-alpine
    container_name: repair-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [backend]

  app:
    build: .
    container_name: repair-app
    restart: unless-stopped
    environment:
      # 生产 profile：关闭 SQL 打印与 Swagger 文档（见 application-prod.yml）
      SPRING_PROFILES_ACTIVE: prod
      # 覆盖 application.yml 里的 localhost，指向 compose 内网服务名
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/repair_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+ExitOnOutOfMemoryError"
    mem_limit: 1g
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [backend]
    # 8080 不直接对外，统一走 nginx

  nginx:
    image: nginx:1.27-alpine
    container_name: repair-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [backend]

networks:
  backend:

volumes:
  mysql-data:
  redis-data:
